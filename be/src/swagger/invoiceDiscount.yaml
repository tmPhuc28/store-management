openapi: 3.0.0
info:
  title: Invoice Discount API
  description: API for managing invoice discounts
  version: 1.0.0
tags:
  - name: InvoiceDiscounts
    description: Invoice discount management endpoints

components:
  schemas:
    InvoiceDiscount:
      type: object
      required:
        - name
        - code
        - type
        - value
        - startDate
      properties:
        name:
          type: string
          example: "New Year Sale"
        code:
          type: string
          example: "NEWYEAR2024"
        description:
          type: string
          example: "New Year sale discount for all orders"
        type:
          type: string
          enum: [percentage, fixed]
          example: "percentage"
        value:
          type: number
          example: 15
          description: Percentage or fixed amount
        minOrderValue:
          type: number
          minimum: 0
          example: 1000000
          description: Minimum order value required
        maxDiscount:
          type: number
          minimum: 0
          example: 200000
          description: Maximum discount amount for percentage type
          nullable: true
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
          nullable: true
        usageLimit:
          type: integer
          minimum: 1
          example: 100
          nullable: true
        usedCount:
          type: integer
          minimum: 0
          default: 0
          readOnly: true
        status:
          type: integer
          enum: [0, 1]
          default: 1
          description: "0=inactive, 1=active"
        statusText:
          type: string
          enum: [active, inactive]
          readOnly: true
        isActive:
          type: boolean
          readOnly: true
        remainingUses:
          type: integer
          nullable: true
          readOnly: true
        createdBy:
          type: string
          description: Reference to User ID
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

paths:
  /api/v1/invoice-discounts:
    get:
      summary: Get all invoice discounts
      tags: [InvoiceDiscounts]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Results per page
        - in: query
          name: search
          schema:
            type: string
          description: Search in name, code, or description
        - in: query
          name: status
          schema:
            type: integer
            enum: [0, 1]
          description: Filter by status
        - in: query
          name: isActive
          schema:
            type: boolean
          description: Filter active/inactive discounts
        - in: query
          name: minOrderValue
          schema:
            type: number
          description: Filter by minimum order value
        - in: query
          name: sort
          schema:
            type: string
          description: Sort field (prefix with - for DESC)
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InvoiceDiscount'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  pages:
                    type: integer

    post:
      summary: Create new invoice discount (Admin)
      tags: [InvoiceDiscounts]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceDiscount'
      responses:
        201:
          description: Created successfully
        400:
          description: Validation error
        401:
          description: Not authenticated
        403:
          description: Not authorized

  /api/v1/invoice-discounts/{id}:
    get:
      summary: Get invoice discount by ID
      tags: [InvoiceDiscounts]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDiscount'
        404:
          description: Discount not found

    put:
      summary: Update invoice discount (Admin)
      tags: [InvoiceDiscounts]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceDiscount'
      responses:
        200:
          description: Updated successfully
        400:
          description: Validation error
        404:
          description: Discount not found

    delete:
      summary: Delete invoice discount (Admin)
      tags: [InvoiceDiscounts]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Deleted successfully
        400:
          description: Cannot delete used discount
        404:
          description: Discount not found

  /api/v1/invoice-discounts/{id}/status:
    patch:
      summary: Update invoice discount status (Admin)
      tags: [InvoiceDiscounts]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: integer
                  enum: [0, 1]
      responses:
        200:
          description: Status updated successfully
        400:
          description: Invalid status value
        404:
          description: Discount not found

  /api/v1/invoice-discounts/validate:
    post:
      summary: Validate discount code
      tags: [InvoiceDiscounts]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - orderValue
              properties:
                code:
                  type: string
                  example: "SUMMER2024"
                orderValue:
                  type: number
                  example: 1000000
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  discount:
                    $ref: '#/components/schemas/InvoiceDiscount'
                  discountAmount:
                    type: number
                    example: 150000
        400:
          description: Invalid code or conditions not met

  /api/v1/invoice-discounts/{id}/calculate:
    get:
      summary: Calculate discount amount
      tags: [InvoiceDiscounts]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: orderValue
          required: true
          schema:
            type: number
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  amount:
                    type: number
                    example: 150000
        404:
          description: Discount not found