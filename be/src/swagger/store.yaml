# src/swagger/store.yaml
openapi: '3.0.3'
info:
  title: Store Management API
  description: API documentation for the Store Management system
  version: 1.0.0
tags:
  - name: Store
    description: Store management endpoints

components:
  schemas:
    Address:
      type: object
      properties:
        detail:
          type: string
          example: "123 Main Street"
        ward:
          type: string
          example: "Ward 1"
        district:
          type: string
          example: "District 1"
        province:
          type: string
          example: "Ho Chi Minh City"

    BankInfo:
      type: object
      required:
        - bankId
        - accountNumber
        - accountName
      properties:
        bankId:
          type: string
          example: "MB"
        bin:
          type: string
          example: "970422"
        shortName:
          type: string
          example: "MBBank"
        accountNumber:
          type: string
          pattern: ^\d{8,19}$
          example: "0987654321"
        accountName:
          type: string
          example: "COFFEE SHOP"

    Store:
      type: object
      required:
        - name
        - phone
        - address
      properties:
        name:
          type: string
          example: "Coffee Shop"
        phone:
          type: string
          example: "0283123456"
        email:
          type: string
          format: email
        address:
          $ref: '#/components/schemas/Address'
        taxCode:
          type: string
          pattern: ^\d{10,13}$
        bankInfo:
          $ref: '#/components/schemas/BankInfo'

paths:
  /api/v2/store:
    get:
      summary: Get store information
      tags: [Store]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        404:
          description: Store information not found
    
    put:
      summary: Update store information (Admin only)
      tags: [Store]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Store"
      responses:
        200:
          description: Store updated successfully
        400:
          description: Validation error
        403:
          description: Not authorized (Admin only)
        404:
          description: Store not found

  /api/v2/store/bank-info:
    get:
      summary: Get store's bank information
      tags: [Store]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankInfo"
        404:
          description: Bank information not found

    put:
      summary: Update store's bank information (Admin only)
      tags: [Store]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankInfo"
      responses:
        200:
          description: Bank information updated successfully
        400:
          description: Validation error
        403:
          description: Not authorized (Admin only)
        404:
          description: Store not 
          
  /api/v2/store/history:
    get:
      summary: Get store update history (Admin only)
      tags: [Store]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          description: Items per page
        - in: query
          name: sort
          schema:
            type: string
            enum: [timestamp, -timestamp]
            default: -timestamp
          description: Sort by timestamp
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            action:
                              type: string
                            updatedBy:
                              type: object
                              properties:
                                _id:
                                  type: string
                                username:
                                  type: string
                            timestamp:
                              type: string
                              format: date-time
                            changes:
                              type: object
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
                      pages:
                        type: integer
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin only
    
    delete:
      summary: Clear all store history (Admin only)
      tags: [Store]
      security:
        - bearerAuth: []
      responses:
        200:
          description: History cleared successfully
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin only

  /api/v2/store/history/{historyId}:
    delete:
      summary: Delete specific history entry (Admin only) 
      tags: [Store]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: historyId
          required: true
          schema:
            type: string
          description: History entry ID
      responses:
        200:
          description: History entry deleted successfully
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin only
        404:
          description: History entry not found