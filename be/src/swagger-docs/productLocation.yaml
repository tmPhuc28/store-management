openapi: 3.0.0
info:
  title: Product Location API
  description: API documentation for product location management
  version: 1.0.0
tags:
  - name: ProductLocations
    description: Product location management endpoints

components:
  schemas:
    Zone:
      type: object
      required:
        - warehouse
        - area
        - rack
      properties:
        warehouse:
          type: string
          example: "WH1"
        area:
          type: string
          example: "A1"
        rack:
          type: string
          example: "R1"
        shelf:
          type: string
          example: "S1"
        bin:
          type: string
          example: "B1"

    ProductLocation:
      type: object
      required:
        - product
        - zone
        - quantity
      properties:
        product:
          type: string
          description: Reference to Product ID
        zone:
          $ref: '#/components/schemas/Zone'
        quantity:
          type: integer
          minimum: 0
          example: 100
        maxQuantity:
          type: integer
          minimum: 0
          example: 500
          nullable: true
        status:
          type: integer
          enum: [0, 1]
          default: 1
          description: "0=inactive, 1=active"
        notes:
          type: string
          example: "Main storage location for this product"
        createdBy:
          type: string
          description: Reference to User
        statusText:
          type: string
          enum: [active, inactive]
          readOnly: true
        locationCode:
          type: string
          readOnly: true
          example: "WH1-A1-R1-S1-B1"
        availableSpace:
          type: integer
          readOnly: true
          example: 400
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

paths:
  /api/v1/product-locations:
    get:
      summary: Get all product locations
      tags: [ProductLocations]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Results per page
        - in: query
          name: search
          schema:
            type: string
          description: Search in warehouse, area, rack, shelf, bin, or notes
        - in: query
          name: status
          schema:
            type: integer
            enum: [0, 1]
          description: Filter by status
        - in: query
          name: product
          schema:
            type: string
          description: Filter by product ID
        - in: query
          name: warehouse
          schema:
            type: string
          description: Filter by warehouse
        - in: query
          name: area
          schema:
            type: string
          description: Filter by area
        - in: query
          name: rack
          schema:
            type: string
          description: Filter by rack
        - in: query
          name: hasAvailableSpace
          schema:
            type: boolean
          description: Filter locations with available space
        - in: query
          name: sort
          schema:
            type: string
          description: Sort field (prefix with - for DESC)
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductLocation'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  pages:
                    type: integer

    post:
      summary: Create new product location (Admin)
      tags: [ProductLocations]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductLocation'
      responses:
        201:
          description: Created successfully
        400:
          description: Validation error
        401:
          description: Not authenticated
        403:
          description: Not authorized

  /api/v1/product-locations/warehouses:
    get:
      summary: Get list of warehouses
      tags: [ProductLocations]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: ["WH1", "WH2", "WH3"]

  /api/v1/product-locations/warehouses/{warehouse}/areas:
    get:
      summary: Get areas in a warehouse
      tags: [ProductLocations]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: warehouse
          required: true
          schema:
            type: string
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: ["A1", "A2", "A3"]

  /api/v1/product-locations/products/{productId}/summary:
    get:
      summary: Get product locations summary
      tags: [ProductLocations]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalLocations:
                    type: integer
                    example: 5
                  activeLocations:
                    type: integer
                    example: 4
                  totalQuantity:
                    type: integer
                    example: 1000
                  availableLocations:
                    type: integer
                    example: 3
                  locations:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductLocation'

  /api/v1/product-locations/{id}:
    get:
      summary: Get product location by ID
      tags: [ProductLocations]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductLocation'
        404:
          description: Product location not found

    put:
      summary: Update product location (Admin)
      tags: [ProductLocations]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductLocation'
      responses:
        200:
          description: Updated successfully
        400:
          description: Validation error
        404:
          description: Product location not found

    delete:
      summary: Delete product location (Admin)
      tags: [ProductLocations]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Deleted successfully
        400:
          description: Cannot delete location with stock
        404:
          description: Product location not found

  /api/v1/product-locations/{id}/status:
    patch:
      summary: Update product location status (Admin)
      tags: [ProductLocations]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: integer
                  enum: [0, 1]
      responses:
        200:
          description: Status updated successfully
        400:
          description: Invalid status value or cannot update status
        404:
          description: Product location not found

  /api/v1/product-locations/{id}/history:
    get:
      summary: Get location update history
      tags: [ProductLocations]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          description: Items per page
        - in: query
          name: sort
          schema:
            type: string
            enum: [timestamp, -timestamp]
            default: -timestamp
          description: Sort by timestamp
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            action:
                              type: string
                            updatedBy:
                              type: object
                              properties:
                                _id:
                                  type: string
                                username:
                                  type: string
                            timestamp:
                              type: string
                              format: date-time
                            changes:
                              type: object
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
                      pages:
                        type: integer
        404:
          description: Product location not found

    delete:
      summary: Clear all history
      tags: [ProductLocations]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: History cleared successfully
        404:
          description: Product location not found