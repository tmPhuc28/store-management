# src/swagger/store.yaml
openapi: '3.0.3'
info:
  title: Store Management API
  description: API documentation for the Store Management system
  version: 1.0.0
tags:
  - name: Store
    description: Store management endpoints

components:
  schemas:
    Address:
      type: object
      properties:
        detail:
          type: string
          example: "123 Main Street"
        ward:
          type: string
          example: "Ward 1"
        district:
          type: string
          example: "District 1"
        province:
          type: string
          example: "Ho Chi Minh City"

    BankInfo:
      type: object
      required:
        - bankId
        - accountNumber
        - accountName
      properties:
        bankId:
          type: string
          example: "MB"
        bin:
          type: string
          example: "970422"
        shortName:
          type: string
          example: "MBBank"
        accountNumber:
          type: string
          pattern: ^\d{8,19}$
          example: "0987654321"
        accountName:
          type: string
          example: "COFFEE SHOP"

    Store:
      type: object
      required:
        - name
        - phone
        - address
      properties:
        name:
          type: string
          example: "Coffee Shop"
        phone:
          type: string
          example: "0283123456"
        email:
          type: string
          format: email
        address:
          $ref: '#/components/schemas/Address'
        taxCode:
          type: string
          pattern: ^\d{10,13}$
        bankInfo:
          $ref: '#/components/schemas/BankInfo'

paths:
  /api/v2/store:
    get:
      summary: Get store information
      tags: [Store]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        404:
          description: Store information not found
    
    put:
      summary: Update store information (Admin only)
      tags: [Store]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Store"
      responses:
        200:
          description: Store updated successfully
        400:
          description: Validation error
        403:
          description: Not authorized (Admin only)
        404:
          description: Store not found

  /api/v2/store/bank-info:
    get:
      summary: Get store's bank information
      tags: [Store]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankInfo"
        404:
          description: Bank information not found

    put:
      summary: Update store's bank information (Admin only)
      tags: [Store]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankInfo"
      responses:
        200:
          description: Bank information updated successfully
        400:
          description: Validation error
        403:
          description: Not authorized (Admin only)
        404:
          description: Store not found